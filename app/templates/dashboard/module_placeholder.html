{% extends "base.html" %}

{% block title %}{{ module_name }} | Exam Seating System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
  <h1 class="h3 mb-0">{{ module_name }}</h1>
  <span class="badge bg-info text-dark">{{ phase_label }}</span>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-4">
    <h2 class="h5 mb-2">Module Scheduled for {{ phase_label }}</h2>
    <p class="text-muted mb-3">{{ description }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-primary btn-sm">
      <i class="bi bi-arrow-left me-1"></i>Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
